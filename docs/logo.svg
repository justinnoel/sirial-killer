<style>
.shake { animation: shake 0.5s linear 9; }
.gasp { transform-box: fill-box; transform-origin: center; animation: gasp 0.5s ease-in-out 9; }
.drip { animation: drip 1.5s ease-in-out 3; }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-4px, 1px); } 40% { transform: translate(4px, -1px); } 60% { transform: translate(-3px, 0); } 80% { transform: translate(3px, 1px); } }
@keyframes gasp { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.22); } }
@keyframes drip { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, 14px); } }
@media (prefers-reduced-motion: reduce) { .shake, .gasp, .drip { animation: none; } }
</style>
